# TEMPORARY, read-only: checks that production serves the Phase 5 routes. Uses no secrets,
# only anonymous GET requests (no sign-in, no writes). Removed right after the run.
name: Temporary Phase 5 route probe

on:
  push:
    branches: [ops/phase5-migrate]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe whether the Phase 5 portal route exists
        run: |
          # A made-up student cookie gets past the proxy's cookie check, so the page itself
          # answers: an existing route redirects to sign-in (session invalid), a missing one
          # is a 404. The token matches no session; nothing is written.
          base=https://www.markazulginna.com.ng
          cookie="__Host-mig_student=probe-not-a-real-session"
          for p in /en/portal /en/portal/results/00000000-0000-4000-8000-000000000000 \
                   /ar/portal/results/00000000-0000-4000-8000-000000000000 \
                   /en/portal/route-that-never-existed; do
            curl -s -o /dev/null -b "$cookie" -w "%{http_code} $p -> %{redirect_url}\n" "$base$p"
          done
