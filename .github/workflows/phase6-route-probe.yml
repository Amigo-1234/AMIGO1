# TEMPORARY, read-only: checks that production serves the Phase 6 portal routes. Uses no
# secrets and makes only anonymous GET requests. Removed right after the run.
name: Temporary Phase 6 route probe

on:
  push:
    branches: [ops/phase5-migrate]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe production routes
        run: |
          base=https://www.markazulginna.com.ng
          # A made-up student cookie gets past the proxy, so the page itself answers:
          # an existing route redirects to sign-in, a missing one is a 404.
          cookie="__Host-mig_student=probe-not-a-real-session"
          for p in /en/portal /en/portal/results /ar/portal/results /en/portal/profile \
                   /ar/portal/profile /en/portal/route-that-never-existed; do
            curl -s -o /dev/null -b "$cookie" -w "%{http_code} $p -> %{redirect_url}\n" "$base$p"
          done
          for p in /en /ar /en/portal/login /ar/portal/login \
                   /en/admin/students/00000000-0000-4000-8000-000000000000/access; do
            curl -s -o /dev/null -w "%{http_code} $p -> %{redirect_url}\n" "$base$p"
          done
