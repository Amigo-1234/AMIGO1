# TEMPORARY: Phase 3 production activation checkpoint. Remove once activation is verified.
#
# Manually triggered only. Checks the live site's auth routes in a real browser and,
# optionally, verifies the first Super Admin bootstrap (read-only) and runs a live student
# sign-in test with one temporary, clearly labelled test student that is archived afterwards.
#
# Secrets (Settings → Secrets and variables → Actions), passed only to the check step:
#   DATABASE_URL, DATABASE_URL_UNPOOLED  same production database as Vercel
#   STUDENT_AUTH_SECRET                  same value as Vercel Production (student test only)
name: Production auth checkpoint

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: "Production site origin, e.g. https://markazilginna.vercel.app (no trailing slash)"
        required: true
        type: string
      expect_setup:
        description: "Should /en/staff/setup be open (before bootstrap) or closed (after)?"
        required: true
        type: choice
        options: [open, closed]
        default: closed
      check_staff_db:
        description: "Verify the first Super Admin bootstrap in the database (read-only)"
        type: boolean
        default: false
      run_student_test:
        description: "Run the live student sign-in test (temporary test student, archived after)"
        type: boolean
        default: false
      probe_urls:
        description: "Extra origins to probe (space-separated), e.g. a deployment URL or custom domain"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: production-auth-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Probe hosts (status, Vercel headers, page title)
        env:
          PROBE: ${{ inputs.base_url }} ${{ inputs.probe_urls }}
        run: |
          for origin in $PROBE; do
            for path in / /en /en/staff/login; do
              echo "== ${origin}${path}"
              curl -sS -o body.html -D headers.txt --max-time 20 "${origin}${path}" || true
              grep -iE '^(HTTP/|server:|x-vercel-id|x-vercel-error|x-vercel-cache|x-matched-path|x-powered-by|location:|age:)' headers.txt || true
              grep -oiE '<title>[^<]*</title>' body.html | head -1 || true
              rm -f body.html headers.txt
            done
          done

      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run checkpoint
        env:
          BASE_URL: ${{ inputs.base_url }}
          EXPECT_SETUP: ${{ inputs.expect_setup }}
          CHECK_STAFF_DB: ${{ inputs.check_staff_db && '1' || '' }}
          RUN_STUDENT_TEST: ${{ inputs.run_student_test && '1' || '' }}
          DATABASE_URL: ${{ (inputs.check_staff_db || inputs.run_student_test) && secrets.DATABASE_URL || '' }}
          DATABASE_URL_UNPOOLED: ${{ (inputs.check_staff_db || inputs.run_student_test) && secrets.DATABASE_URL_UNPOOLED || '' }}
          STUDENT_AUTH_SECRET: ${{ inputs.run_student_test && secrets.STUDENT_AUTH_SECRET || '' }}
        run: npx tsx src/e2e/production-auth-check.ts
